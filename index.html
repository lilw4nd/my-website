<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Home</title>

    <style>

        /* =========================
           FONTES
        ========================= */

        @font-face {
            font-family: "The Silver Editorial";
            src: url("TheSilverEditorial-Italic.ttf") format("truetype");
        }

        @font-face {
            font-family: "Pixelta";
            src: url("Pixelta.ttf") format("truetype");
        }

        @font-face {
            font-family: "Lukalama";
            src: url("Lukalama-Regular.otf") format("truetype");
        }


        /* =========================
           PÁGINA
        ========================= */

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5ec;
            margin: 20px;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           CONTEÚDO PRINCIPAL
        ========================= */

        .container {
            text-align: center;
        }


        /* =========================
           LOGO + GIFS
        ========================= */

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo-da-pagina {
            width: 400px;
            height: auto;
        }

        .gif-lado {
            width: 120px;
            height: auto;
        }


        /* =========================
           RESTANTE DO SITE
        ========================= */

        .guindaste {
            width: 100px;
            height: 100px;
        }

        .placa {
            width: 100px;
            height: 100px;
        }

        .o-que-sou {
            font-family: "Lukalama";
            font-size: 25px;
            margin-top: 10px;
            margin-bottom: 0;
        }

        .bemvindo {
            font-family: "Lukalama";
            font-size: 25px;
            margin-top: 0;
            margin-bottom: 0;
        }

        .link {
            font-family: "The Silver Editorial";
            font-size: 25px;
            color: rgb(61, 61, 61);
            margin: 0 5px;
        }

        .link-sobre {
            font-family: "The Silver Editorial";
            font-size: 25px;
            color: rgb(34, 34, 34);
            margin: 0 5px;
        }

        .aviso {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
            color: #333;
        }

    </style>
</head>


<body>

    <div class="container">

        <!-- LOGO E GIFS DOS LADOS -->
        <div class="logo-area">

            <!-- GIF DA ESQUERDA -->
            <img src="3dlogogirandominha.gif" class="gif-lado" alt="GIF">

            <!-- LOGO DJ LILW4ND -->
            <img
                class="logo-da-pagina"

            <!-- GIF DA DIREITA -->
            <img src="3dlogogirandominha.gif" class="gif-lado" alt="GIF">

        <!-- TEXTO -->

        class="placa"
